[tools]
go = "1.26.3"
gh = "latest"
node = "lts"
pnpm = "11.1.3"
"go:github.com/thenativeweb/get-next-version" = "v0.0.0-20260427193751-283f693d1042"

[tasks.install]
description = "Install workspace dependencies"
run = "pnpm install"

[tasks.lint]
description = "Run ESLint"
run = "pnpm run lint"

[tasks.test]
description = "Run the test suite"
run = "pnpm test"

[tasks.build]
description = "Build the package and examples"
run = [
    "pnpm run build",
    "pnpm --dir examples/counter run build",
    "pnpm --dir examples/async run build",
]

[tasks.next-version]
description = "Get the version number that would be released from the current git history"
run = "get-next-version --prefix v 2> /dev/null | tr -d '\\n'"

[tasks.release]
description = "Calculate the next semantic version, tag it, publish to npm, and create a GitHub release"
run = "scripts/release.sh"
